[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline-doctor"
version = "0.1.0"
description = "AI-powered CI/CD pipeline failure diagnosis and auto-fix agent"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["agent*", "backend*", "lambda*"]
